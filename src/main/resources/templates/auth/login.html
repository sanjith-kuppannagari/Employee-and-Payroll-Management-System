<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Employee & Payroll System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <h1>TechCorp Payroll Management System</h1>
        <div class="nav-links">
            <a href="/login.html" class="active">Admin Login</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="card auth-card">
            <h2>Administrator Sign In</h2>
            <p class="subtitle">Core Java HttpServer & SQLite Payroll Portal</p>
            <div id="loginAlert" class="alert"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" value="admin" required placeholder="Enter admin username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" value="admin123" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-block">Sign In to Dashboard</button>
            </form>
            <p style="margin-top:1rem; font-size:0.8rem; color:#64748b; text-align:center;">
                Default Credentials: <strong>admin</strong> / <strong>admin123</strong>
            </p>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
